name: gates

# The gate suite is the specification (03 Part D), so it runs on every push.
# Phases 0-4 are offline by invariant B1: no network access is needed beyond
# installing dependencies, and no secrets are used anywhere in this workflow.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pinned to exact release tags, not floating majors. A project that asserts
      # byte-identical output should not let its own toolchain drift underneath
      # it -- and setup-uv publishes no floating `v9` tag anyway.
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --all-groups --frozen

      # Resolves every `uses:` ref in every workflow. This is the countermeasure
      # for run 31202076622, which died in 3s on an unresolvable action tag
      # having executed no step. actionlint does NOT catch that -- it never
      # resolves refs against the remote -- and the action wrapping it crashed
      # under Node 24, so this does the job directly with git ls-remote.
      - name: Verify action refs resolve
        run: uv run python scripts/check_action_refs.py

      # mypy is 8s of a 54s job and almost all of it is re-analysing
      # unchanged third-party stubs. The cache key tracks the lockfile and the
      # sources, so a real change still gets a cold, honest run.
      - name: Cache mypy
        uses: actions/cache@v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ hashFiles('falsify/**/*.py', 'tests/**/*.py', 'scripts/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
            mypy-${{ runner.os }}-

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      # --min-collected is the countermeasure for the inverse failure: a suite
      # that runs nothing and reports success.
      - name: Gate suite
        run: uv run pytest tests -v -n auto --min-collected=275

      # The figure is a deliverable (Session 1) and G10 will assert it is
      # byte-reproducible. Keeping it as an artefact makes a CI regression
      # inspectable rather than merely red.
      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: figures
          path: docs/figures/
          if-no-files-found: warn
