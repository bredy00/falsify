[project]
name = "falsify"
version = "0.1.0"
description = "A backtester that reports an estimate, its error bar, and the probability the number survived the search that produced it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-xdist>=3.6",
]
# Report generation. Separate from dev because nothing in the gate suite depends
# on it -- but CI installs it so mypy can typecheck scripts/status_report.py.
docs = [
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["falsify"]

# ----------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "NPY",       # numpy-specific rules
    "PTH",       # prefer pathlib
    "RUF",
]
# PD011 etc. are pandas-vet and not enabled; the hot path is numpy by design.

[tool.ruff.lint.per-file-ignores]
# E501: gate tests assert on values printed for the record; long f-strings are
#       clearer on one line than wrapped.
# RUF001: figure captions use real typography -- en dashes, the multiplication
#       sign, a star glyph. These are deliberate in rendered output, not
#       homoglyph mistakes. Scoped to tests so it cannot mask a confusable in
#       package code.
"tests/**" = ["E501", "RUF001"]
# The status report is prose and typography, not logic: sigma, minus sign,
# superscripts and long sentences all belong in the copy. Scoped to this one file
# rather than to scripts/ so it cannot mask a confusable in the ref checker.
"scripts/status_report.py" = ["E501", "RUF001"]
# The comparison figure is labelled in the notation of the subject -- rho, beta,
# phi, degree signs. Same reasoning, same tight scope.
"scripts/regression_comparison.py" = ["E501", "RUF001"]
"scripts/regression_report.py" = ["E501", "RUF001"]

# ----------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# The gate suite is the specification (03 Part D), so it is typechecked as
# strictly as the package it specifies. No per-directory relaxation.
files = ["falsify", "tests", "scripts"]

[[tool.mypy.overrides]]
# scipy and matplotlib ship incomplete annotations; their absence must not be
# allowed to silently weaken checking of our own code, so this is scoped to the
# imports themselves rather than set globally.
module = ["scipy.*", "matplotlib.*", "reportlab.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --durations=10"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: gates that take more than a few seconds",
]
