name: gates

# The gate suite is the specification (03 Part D), so it runs on every push.
# Phases 0-4 are offline by invariant B1: no network access is needed beyond
# installing dependencies, and no secrets are used anywhere in this workflow.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pinned to exact release tags, not floating majors. A project that asserts
      # byte-identical output should not let its own toolchain drift underneath
      # it -- and setup-uv publishes no floating `v9` tag anyway.
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --all-groups --frozen

      # Catches a malformed workflow -- the failure mode that killed run
      # 31202076622 before a single step executed, which no in-repo test could
      # have detected because the suite never started.
      - name: Lint workflows
        uses: raven-actions/actionlint@v2.0.1

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      # --min-collected is the countermeasure for the inverse failure: a suite
      # that runs nothing and reports success.
      - name: Gate suite
        run: uv run pytest tests -v --min-collected=75

      # The figure is a deliverable (Session 1) and G10 will assert it is
      # byte-reproducible. Keeping it as an artefact makes a CI regression
      # inspectable rather than merely red.
      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: figures
          path: docs/figures/
          if-no-files-found: warn
